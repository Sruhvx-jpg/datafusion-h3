[package]
name = "quinn-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
dotenvy = "0.15.7"
datafusion = "44"
bytes = "1"
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
server-conf = { version = "0.1.0", path = "../../packages/server-conf" }
quinn-router = { version = "0.1.0", path = "../../packages/quinn-router" }
lb = { version = "0.1.0", path = "../../packages/lb" }
